            // Create User message element with ChatGPT Copy + Edit icons (no profile avatar)
            function createUserMessageElement(text) {
                const wrapper = document.createElement('div');
                wrapper.className = 'message-wrapper user';
                wrapper.style.animation = 'fadeIn 0.3s';

                const formatted = (text || '').replace(/\n/g, '<br>');
                wrapper.innerHTML = `
                    <div class="message-content-wrapper">
                        <div class="message-bubble">${formatted}</div>
                        <div class="message-actions">
                            <button class="action-btn copy-btn" title="Copy">${copySvg}</button>
                            <button class="action-btn edit-btn" title="Edit message">${editSvg}</button>
                        </div>
                    </div>
                `;

                const copyBtn = wrapper.querySelector('.copy-btn');
                const editBtn = wrapper.querySelector('.edit-btn');
                copyBtn.addEventListener('click', () => copyMessageText(copyBtn, text));
                editBtn.addEventListener('click', () => startEditingMessage(wrapper, text));

                return wrapper;
            }

            // Helper: Render Markdown with clickable target="_blank" links (ChatGPT Style)
            function renderMarkdownContent(rawText) {
                if (!rawText) return '';
                if (window.marked && typeof window.marked.parse === 'function') {
                    try {
                        let parsed = window.marked.parse(rawText);
                        // Make all links open in new tab securely
                        parsed = parsed.replace(/<a\s+(?:[^>]*?\s+)?href="([^"]*)"([^>]*)>/gi, '<a href="$1"$2 target="_blank" rel="noopener noreferrer">');
                        return parsed;
                    } catch (e) {
                        console.warn("Markdown parse error, falling back:", e);
                    }
                }
                // Fallback formatter
                return escapeHtml(rawText)
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
                    .replace(/\n/g, '<br>');
            }

            // Helper: Extract Related Topics from AI report
            function extractRelatedTopics(text) {
                if (!text) return [];
                const regex = /(?:##+\s*(?:💡\s*)?(?:Related Topics|Further Research|Related Questions|Suggested Follow-ups)[^\n]*\n)([\s\S]*?)(?:$|(?=##\s))/i;
                const match = text.match(regex);
                if (!match) return [];
                
                const sectionContent = match[1];
                const lines = sectionContent.split('\n');
                const topics = [];
                for (const line of lines) {
                    const cleaned = line.replace(/^[\s*\-•\d\.)]+/, '').trim();
                    if (cleaned.length >= 5 && cleaned.length <= 120 && !cleaned.startsWith('http')) {
                        topics.push(cleaned);
                    }
                }
                return topics.slice(0, 4);
            }

            // Create AI message element with Structured Markdown, Sources, Related Topics & Approval Card
            function createAiMessageElement(text, isReport = false) {
                const wrapper = document.createElement('div');
                wrapper.className = 'message-wrapper ai';
                wrapper.style.animation = 'fadeIn 0.3s';

                const formatted = renderMarkdownContent(text);
                wrapper.innerHTML = `
                    <div class="message-content-wrapper">
                        <div class="message-bubble">${formatted}</div>
                        <div class="message-actions">
                            <button class="action-btn copy-btn" title="Copy">${copySvg}</button>
                        </div>
                    </div>
                `;

                const contentWrapper = wrapper.querySelector('.message-content-wrapper');
                const copyBtn = wrapper.querySelector('.copy-btn');
                copyBtn.addEventListener('click', () => copyMessageText(copyBtn, text));

                // 1. Interactive Related Topics Chips (ChatGPT / Perplexity discovery workflow)
                const relatedTopics = extractRelatedTopics(text);
                if (relatedTopics.length > 0) {
                    const relatedDiv = document.createElement('div');
                    relatedDiv.className = 'related-topics-container';
                    relatedDiv.innerHTML = `
                        <div class="related-topics-title">
                            <i class="fa-solid fa-compass"></i> Related Research Topics
                        </div>
                        <div class="related-topics-list"></div>
                    `;
                    const listElem = relatedDiv.querySelector('.related-topics-list');
                    relatedTopics.forEach(topic => {
                        const chip = document.createElement('button');
                        chip.className = 'topic-chip';
                        chip.title = `Research: ${topic}`;
                        chip.innerHTML = `<i class="fa-solid fa-arrow-right"></i> <span>${escapeHtml(topic)}</span>`;
                        chip.addEventListener('click', () => {
                            inputField.value = topic;
                            sendMessage();
                        });
                        listElem.appendChild(chip);
                    });
                    contentWrapper.appendChild(relatedDiv);
                }

                // 2. Direct PDF Ready Card (Triggered when user says "make pdf" / "generate pdf")
                const hasPdfLink = text && (text.includes('/api/research/download-pdf') || text.includes('Final_Research_Report.pdf'));
                if (hasPdfLink) {
                    const pdfCard = document.createElement('div');
                    pdfCard.className = 'pdf-direct-card';
                    pdfCard.innerHTML = `
                        <div class="pdf-info">
                            <div class="pdf-icon"><i class="fa-solid fa-file-pdf"></i></div>
                            <div>
                                <div class="pdf-name">Final_Research_Report.pdf</div>
                                <div class="pdf-desc">Comprehensive Formatted Research Document</div>
                            </div>
                        </div>
                        <a href="/api/research/download-pdf" target="_blank" download="Final_Research_Report.pdf" class="download-pdf-btn">
                            <i class="fa-solid fa-download"></i> Download PDF
                        </a>
                    `;
                    contentWrapper.appendChild(pdfCard);
                }

                return wrapper;
            }

            // 2. Fetch and render messages for a specific conversation thread
            async function loadConversationMessages(convId, title) {
                closeMobileSidebar();
                chatContainer.innerHTML = `
                    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); animation: fadeIn 0.3s;">
                        <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 2rem; color: var(--primary-color); margin-bottom: 16px;"></i>
                        <p>Loading <strong>${escapeHtml(title)}</strong>...</p>
                    </div>
                `;

                try {
                    const response = await fetch(`/api/research/conversations/${convId}/messages`);
                    if (!response.ok) throw new Error("Failed to load messages");
                    const messages = await response.json();

                    chatContainer.innerHTML = '';
                    if (!messages || messages.length === 0) {
                        chatContainer.innerHTML = `<p style="color: var(--text-muted); text-align: center; margin-top: 40px;">No messages found in this conversation.</p>`;
                        return;
                    }

                    messages.forEach((msg, idx) => {
                        if (msg.sender === 'ai') {
                            const isLatestAi = (idx === messages.length - 1);
                            chatContainer.appendChild(createAiMessageElement(msg.text || '', isLatestAi));
                        } else {
                            chatContainer.appendChild(createUserMessageElement(msg.text || ''));
                        }
                    });
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                } catch (err) {
                    chatContainer.innerHTML = `<p style="color: #ef4444; text-align: center; margin-top: 40px;">Failed to load messages from database.</p>`;
                }
            }

            // New Conversation button
            newChatBtn.addEventListener('click', startNewGeneralChat);

            let currentAbortController = null;
            let activeTaskId = null;

            let isResearching = false;

            function restoreSendButton() {
                isResearching = false;
                sendBtn.classList.remove('stop-btn');
                sendBtn.disabled = false;
                sendBtn.innerHTML = `<span class="send-text">Send</span> <i class="fa-solid fa-paper-plane"></i>`;
                sendBtn.title = "Send research prompt";
            }

            function setStopButton() {
                isResearching = true;
                sendBtn.classList.add('stop-btn');
                sendBtn.disabled = false;
                sendBtn.innerHTML = `<i class="fa-solid fa-square"></i> <span class="send-text">Stop</span>`;
                sendBtn.title = "Stop research immediately";
            }

            // Terminate ongoing AI research (both in browser and on Python backend)
            window.terminateResearch = function() {
                const taskIdToKill = activeTaskId;
                activeTaskId = null;

                if (currentAbortController) {
                    currentAbortController.abort();
                    currentAbortController = null;
                }

                // Tell the FastAPI backend to kill background tasks immediately!
                if (taskIdToKill) {
                    fetch('/api/research/terminate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ task_id: taskIdToKill })
                    }).catch(err => console.log("Backend terminate notification error:", err));
                }

                restoreSendButton();
                const loadingElem = document.querySelector('.message-wrapper.ai.loading-state');
                if (loadingElem) {
                    loadingElem.classList.remove('loading-state');
                    const bubble = loadingElem.querySelector('.message-bubble');
                    if (bubble) {
                        bubble.innerHTML = `<i class="fa-solid fa-circle-stop" style="color: #ef4444; margin-right: 6px;"></i> Research stopped by user.`;
                        bubble.style.borderColor = 'rgba(239, 68, 68, 0.4)';
                    }
                }
                const cursors = document.querySelectorAll('.chatgpt-cursor');
                cursors.forEach(c => c.remove());
            };

            // 3. Send message & save to conversation thread (supports active Project context)
            async function sendMessage() {
                if (isResearching) return;
                const text = inputField.value.trim();
                if (!text) return;
                
                if (chatContainer.querySelector('h2') || chatContainer.querySelector('.project-workspace')) {
                    chatContainer.innerHTML = '';
                }

                // 1. Show User Message
                chatContainer.appendChild(createUserMessageElement(text));
                inputField.value = '';
                chatContainer.scrollTop = chatContainer.scrollHeight;

                // 2. Set Active Task & Abort Controller (Morph Send into Stop Button)
                activeTaskId = "task-" + Date.now();
                currentAbortController = new AbortController();
                setStopButton();

                // Show Clean Loading Indicator
                const loadingId = "loading-" + Date.now();
                const loadingElem = document.createElement('div');
                loadingElem.id = loadingId;
                loadingElem.className = 'message-wrapper ai loading-state';
                loadingElem.style.animation = 'fadeIn 0.3s';
                loadingElem.innerHTML = `
                    <div class="message-bubble" style="display: flex; align-items: center; gap: 8px;">
                        <i class="fa-solid fa-circle-notch fa-spin" style="color: var(--primary-color);"></i>
                        <span>Researching...</span>
                    </div>
                `;
                chatContainer.appendChild(loadingElem);
                chatContainer.scrollTop = chatContainer.scrollHeight;

                try {
                    // 3. Send to FastAPI backend with current conversation ID, project ID, task ID, selected Model, and abort signal
                    const chosenModel = selectedModelInput ? selectedModelInput.value : 'nvidia_llama';
                    const response = await fetch('/api/research/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            user_topic: text,
                            conversation_id: activeConversationId,
                            project_id: activeProjectId,
                            task_id: activeTaskId,
                            model_id: chosenModel
                        }),
                        signal: currentAbortController.signal
                    });

                    let data;
                    if (!response.ok) {
                        let errMsg = `Server returned HTTP ${response.status} (${response.statusText || 'Error'})`;
                        try {
                            const errJson = await response.json();
                            if (errJson && (errJson.detail || errJson.message || errJson.error)) {
                                errMsg = errJson.detail || errJson.message || errJson.error;
                            }
                        } catch (_) {
                            const text = await response.text().catch(() => '');
                            if (text && text.length < 300) errMsg = text;
                        }
                        throw new Error(errMsg);
                    }

                    data = await response.json();
                    
                    if (data.conversation_id) {
                        activeConversationId = data.conversation_id;
                    }

                    // 4. Show AI Response via ChatGPT Word-by-Word Streaming
                    const activeLoadingElem = document.getElementById(loadingId);
                    if (activeLoadingElem) activeLoadingElem.remove();

                    const reportText = data.report || data.message || "Done!";
                    await streamAiResponseWordByWord(reportText, data);

                    // Automatically trigger PDF download if user requested PDF
                    if (data.is_pdf_ready && data.pdf_url) {
                        window.open(data.pdf_url, '_blank');
                    }

                    // 5. Refresh conversations and projects list, keeping current thread active
                    await loadConversationsList(false, activeConversationId);
                    await loadProjectsList();

                } catch (error) {
                    if (error.name === 'AbortError') {
                        return;
                    }

                    const activeLoadingElem = document.getElementById(loadingId);
                    if (activeLoadingElem) activeLoadingElem.remove();

                    const displayError = error.message || "Failed to reach server.";
                    const isNetworkError = (error instanceof TypeError) || displayError.toLowerCase().includes("failed to fetch") || displayError.toLowerCase().includes("networkerror");

                    let errorHtml = '';
                    if (isNetworkError) {
                        errorHtml = `
                            <div style="font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 8px;">
                                <i class="fa-solid fa-triangle-exclamation"></i> Connection Failed
                            </div>
                            <div style="font-size: 0.88rem; color: #cbd5e1; line-height: 1.5;">
                                Unable to reach the FastAPI backend server.
                                <ul style="margin: 6px 0 0 18px; padding: 0;">
                                    <li><strong>Running locally:</strong> Ensure Uvicorn is running: <code>python -m uvicorn main:app --reload</code></li>
                                    <li><strong>Deployed on Render:</strong> Free instances spin down after 15 mins of inactivity and take ~50 seconds to boot. Check <a href="https://dashboard.render.com" target="_blank" style="color: #5eead4; text-decoration: underline;">Render Dashboard Logs</a> if it does not recover.</li>
                                </ul>
                            </div>
                        `;
                    } else {
                        errorHtml = `
                            <div style="font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 8px;">
                                <i class="fa-solid fa-circle-exclamation"></i> Request Error
                            </div>
                            <div style="font-size: 0.88rem; color: #cbd5e1; line-height: 1.5;">
                                ${escapeHtml(displayError)}
                            </div>
                        `;
                    }

                    chatContainer.innerHTML += `
                        <div class="message-wrapper ai" style="color: #ef4444;">
                            <div class="message-bubble" style="border-color: rgba(239, 68, 68, 0.4); background: rgba(239, 68, 68, 0.08);">${errorHtml}</div>
                        </div>
                    `;
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                } finally {
                    currentAbortController = null;
                    restoreSendButton();
                }
            }

            // ChatGPT-Style Word-by-Word Typewriter Streaming Animation
            async function streamAiResponseWordByWord(fullText, data) {
                const wrapper = document.createElement('div');
                wrapper.className = 'message-wrapper ai';
                wrapper.style.animation = 'fadeIn 0.3s';

                const contentWrapper = document.createElement('div');
                contentWrapper.className = 'message-content-wrapper';

                const bubble = document.createElement('div');
                bubble.className = 'message-bubble';
                contentWrapper.appendChild(bubble);
                wrapper.appendChild(contentWrapper);
                chatContainer.appendChild(wrapper);

                // Tokenize by words and whitespace
                const tokens = fullText.split(/(\s+)/);
                let currentText = '';
                
                // Adaptive chunking: smooth live typing speed
                const chunkSize = 2; // 2 tokens per frame
                for (let i = 0; i < tokens.length; i += chunkSize) {
                    const chunk = tokens.slice(i, i + chunkSize).join('');
                    currentText += chunk;
                    bubble.innerHTML = renderMarkdownContent(currentText) + `<span class="chatgpt-cursor"></span>`;
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                    await new Promise(r => setTimeout(r, 14));
                }

                // Final render without cursor
                bubble.innerHTML = renderMarkdownContent(fullText);

                // Add Copy action button
                const actions = document.createElement('div');
                actions.className = 'message-actions';
                actions.innerHTML = `<button class="action-btn copy-btn" title="Copy">${copySvg}</button>`;
                const copyBtn = actions.querySelector('.copy-btn');
                copyBtn.addEventListener('click', () => copyMessageText(copyBtn, fullText));
                contentWrapper.appendChild(actions);

                // Add Related Topics Chips (ChatGPT / Perplexity style)
                const relatedTopics = extractRelatedTopics(fullText);
                if (relatedTopics.length > 0) {
                    const relatedDiv = document.createElement('div');
                    relatedDiv.className = 'related-topics-container';
                    relatedDiv.innerHTML = `
                        <div class="related-topics-title">
                            <i class="fa-solid fa-compass"></i> Related Research Topics
                        </div>
                        <div class="related-topics-list"></div>
                    `;
                    const listElem = relatedDiv.querySelector('.related-topics-list');
                    relatedTopics.forEach(topic => {
                        const chip = document.createElement('button');
                        chip.className = 'topic-chip';
                        chip.title = `Research: ${topic}`;
                        chip.innerHTML = `<i class="fa-solid fa-arrow-right"></i> <span>${escapeHtml(topic)}</span>`;
                        chip.addEventListener('click', () => {
                            inputField.value = topic;
                            sendMessage();
                        });
                        listElem.appendChild(chip);
                    });
                    contentWrapper.appendChild(relatedDiv);
                }

                // Direct PDF Ready Card if applicable
                const hasPdfLink = fullText && (fullText.includes('/api/research/download-pdf') || fullText.includes('Final_Research_Report.pdf'));
                if (hasPdfLink) {
                    const pdfCard = document.createElement('div');
                    pdfCard.className = 'pdf-direct-card';
                    pdfCard.innerHTML = `
                        <div class="pdf-info">
                            <div class="pdf-icon"><i class="fa-solid fa-file-pdf"></i></div>
                            <div>
                                <div class="pdf-name">Final_Research_Report.pdf</div>
                                <div class="pdf-desc">Comprehensive Formatted Research Document</div>
                            </div>
                        </div>
                        <a href="/api/research/download-pdf" target="_blank" download="Final_Research_Report.pdf" class="download-pdf-btn">
                            <i class="fa-solid fa-download"></i> Download PDF
                        </a>
                    `;
                    contentWrapper.appendChild(pdfCard);
                }

                chatContainer.scrollTop = chatContainer.scrollHeight;
            }

            sendBtn.addEventListener('click', () => {
                if (isResearching) {
                    window.terminateResearch();
                } else {
                    sendMessage();
                }
            });

            inputField.addEventListener('keypress', (e) => { 
                if (e.key === 'Enter') {
                    if (!isResearching) {
                        sendMessage();
                    }
                }
            });

            // Initialize on page load (load conversations & projects cleanly)
            async function initializeApp() {
                await loadConversationsList(true);
                await loadProjectsList();
            }
            initializeApp();
        });
    </script>
</body>
</html>
